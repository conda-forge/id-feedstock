# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"
  python_check_max: "3.14"

package:
  name: id
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/id/id-${{ version }}.tar.gz
  sha256: 4ca6e16f99e34d87ff2d9044fdf3bf278fcff33de56745a3734af9101fff6269

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - flit-core >=3.2,<4
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - urllib3 >=2,<3

tests:
  - python:
      imports: id
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - test/
    requirements:
      run:
        - pretend
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      - coverage run --source=id --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=82

about:
  summary: A tool for generating OIDC identities
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/id
  repository: https://github.com/di/id

extra:
  recipe-maintainers:
    - bollwyvl
